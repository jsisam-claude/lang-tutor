org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
# Configuration cache is ON again. It used to break AGP's asset-pack plugin
# with "AnalyticsService ... is not registered"; re-tested on AGP 8.13 /
# Gradle 9.5.1 and :app:bundleDebug (the asset-pack task that failed) now
# builds and reuses the entry. Measured on a no-op build: the full
# multi-module `build` went 4214ms -> 1572ms with this plus parallel.
org.gradle.configuration-cache=true
# Independent modules configure and execute concurrently; worth ~2x on the
# multi-module lane, roughly nothing on :app alone.
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
