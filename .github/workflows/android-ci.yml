name: android-ci

on:
  push:
  pull_request:

# A newer push supersedes older in-flight runs for the same branch — cancel
# them instead of letting three stale builds fight over runners and caches.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the android job re-widens to actions:write so
# its prune step can delete superseded artifacts.
permissions:
  contents: read

jobs:
  # Cheap lane: pure-JVM modules + unit tests. Mirrors the sandboxed
  # `-Plangtutor.jvmOnly=true` build documented in the README.
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -Plangtutor.jvmOnly=true build --stacktrace

  # Full lane: compiles the Compose app and exercises the asset-pack module
  # via bundleDebug. ubuntu-latest ships the Android SDK preinstalled.
  android:
    runs-on: ubuntu-latest
    needs: jvm
    permissions:
      contents: write # the rolling debug-latest release below
      actions: write # the artifact-prune step below
    # Normal green time is ~6-8 min; a hang must fail fast, not burn 6 h of
    # runner quota (observed once after adding a new AAR dependency).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Google's prebuilt WebGPU sampler/accelerator/dawn (LiteRT-LM v0.14.0,
      # SHA-256-pinned in the script) → app jniLibs, so GPU generation works on
      # devices without OpenCL (GrapheneOS). Without this step the build still
      # succeeds — the engine's smoke test just falls back to CPU.
      - run: scripts/fetch-gpu-libs.sh
      # Tuki's Kokoro voice vectors (522KB, SHA-256-pinned) → APK assets.
      - run: scripts/fetch-voice-assets.sh
      # Hands-free listening model (639KB, SHA-256-pinned) → APK assets.
      - run: scripts/fetch-vad-asset.sh
      - run: ./gradlew test :app:assembleDebug :app:bundleDebug --stacktrace
      # Publish the installable debug APK so a green run yields a sideloadable
      # build for on-device testing (docs/running-on-device.md).
      # NOTE: the APK is the app only — the model is not bundled; install it in
      # app (Parent Zone → Packs) or via adb push.
      # The AAB is deliberately NOT uploaded: bundleDebug above still exercises
      # the asset-pack module, but nothing consumes the .aab (push.sh and
      # TESTING.md install the APK) and it doubled the artifact — measured
      # 187 MB with both against a 500 MB private-repo storage quota.
      # PRIMARY delivery: a rolling pre-release whose single asset is always
      # the newest green APK. Release assets do not count against the Actions
      # artifact storage quota — which blocked artifact uploads for weeks'
      # worth of a billing month once the quota was exceeded — and the release
      # URL is stable, so TESTING.md can link it directly.
      - name: Publish APK to the rolling debug-latest release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          NOTES="Newest green debug build.
          commit: ${{ github.sha }}
          built:  $(date -u +%Y-%m-%dT%H:%M:%SZ)
          The tag itself does not move; trust these notes and the asset, not the tag's commit."
          gh release view debug-latest >/dev/null 2>&1 || \
            gh release create debug-latest --prerelease \
              --title "Latest debug APK" --notes "$NOTES" --target "${{ github.sha }}"
          gh release upload debug-latest "$APK" --clobber
          gh release edit debug-latest --notes "$NOTES"
      # Best-effort secondary: the classic run artifact. continue-on-error
      # because the Actions storage quota is monthly GB-hours — once spent, no
      # deletion unblocks it until the cycle resets, and a verified-green build
      # must not read as a failure over a billing condition.
      - uses: actions/upload-artifact@v4
        if: success()
        continue-on-error: true
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          # The APK is already zip-compressed; recompressing buys ~nothing and
          # costs upload minutes.
          compression-level: 0
          # Backstop only — the prune step below keeps peak storage at about
          # one artifact; retention covers a quiet week with no pushes.
          retention-days: 5
      # A green build supersedes every older APK: delete them instead of
      # letting up to 5 days of ~100 MB artifacts stack up against the quota.
      - name: Prune superseded artifacts
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            for (const a of artifacts) {
              if (a.name !== 'app-debug' || a.expired || a.workflow_run?.id === context.runId) continue;
              core.info(`deleting superseded ${a.name} #${a.id} from run ${a.workflow_run?.id} (${(a.size_in_bytes / 1e6).toFixed(0)} MB)`);
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
            }
