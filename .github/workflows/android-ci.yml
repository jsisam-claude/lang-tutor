name: android-ci

on:
  push:
  pull_request:

jobs:
  # Cheap lane: pure-JVM modules + unit tests. Mirrors the sandboxed
  # `-Plangtutor.jvmOnly=true` build documented in the README.
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -Plangtutor.jvmOnly=true build --stacktrace

  # Full lane: compiles the Compose app and exercises the asset-pack module
  # via bundleDebug. ubuntu-latest ships the Android SDK preinstalled.
  android:
    runs-on: ubuntu-latest
    needs: jvm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test :app:assembleDebug :app:bundleDebug --stacktrace
