name: android-ci

on:
  push:
  pull_request:

jobs:
  # Cheap lane: pure-JVM modules + unit tests. Mirrors the sandboxed
  # `-Plangtutor.jvmOnly=true` build documented in the README.
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -Plangtutor.jvmOnly=true build --stacktrace

  # Full lane: compiles the Compose app and exercises the asset-pack module
  # via bundleDebug. ubuntu-latest ships the Android SDK preinstalled.
  android:
    runs-on: ubuntu-latest
    needs: jvm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test :app:assembleDebug :app:bundleDebug --stacktrace
      # Publish the installable debug APK (+ AAB) so a green run yields a
      # sideloadable build for on-device testing (docs/running-on-device.md).
      # NOTE: the APK is the app only — the model is not bundled; install it in
      # app (Parent Zone → Packs) or via adb push.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 30
