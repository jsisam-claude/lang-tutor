name: android-ci

# Both events, but each job runs at most ONCE per commit: a same-repo branch
# PR would otherwise build twice (once for the push, once for the PR). The
# `if:` on each job keeps push runs for our own branches and pull_request runs
# only for FORKS, whose commits never produce a push event here.
on:
  push:
  pull_request:

# A newer push supersedes older in-flight runs for the same branch — cancel
# them instead of letting three stale builds fight over runners and caches.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the android job re-widens to contents:write so
# it can publish the rolling debug-latest release.
#
# All three actions sit at v5, the majors that declare `using: node24` and
# silence the Node.js-20 deprecation warning every green v4 run carried.
# PROVEN: the clean retry on its own commit (run #145, 2026-08-31) came back
# green, so the 2026-08-27 failures below were never about the version.
#
# The 2026-08-27 startup failures, for the record:
# RESOLVED (as a mystery, not a diagnosis): every run from #136 onward is
# green again with NOTHING changed — same file, same account, no billing
# action taken. The failures span exactly #130-#133, an eleven-minute window
# on 2026-08-27 (22:18-22:29 UTC); the next push, 15 hours later, just
# worked. Two earlier theories are dead: "version policy" was disproven by
# #132 (the v4 revert failed identically), and "exhausted minutes/billing"
# by the repo being public (standard runners on public repos are free) and
# by the recovery happening without anyone touching billing. What remains is
# a GitHub-side transient — runner pool or scheduling outage. If this
# signature recurs (instant failure, jobs created, zero steps, no runner,
# no logs): first check githubstatus.com and simply wait; do not churn the
# workflow file, it has been proven innocent — and the v5 bump is now
# proven green too (see above), so there is nothing left to retry.

permissions:
  contents: read

jobs:
  # Cheap lane: pure-JVM modules + unit tests. Mirrors the sandboxed
  # `-Plangtutor.jvmOnly=true` build documented in the README.
  jvm:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew -Plangtutor.jvmOnly=true build --stacktrace

  # Full lane: compiles the Compose app and exercises the asset-pack module
  # via bundleDebug. ubuntu-latest ships the Android SDK preinstalled.
  android:
    runs-on: ubuntu-latest
    needs: jvm
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: write # the rolling debug-latest release below
    # Normal green time is ~6-8 min; a hang must fail fast, not burn 6 h of
    # runner quota (observed once after adding a new AAR dependency).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      # Google's prebuilt WebGPU sampler/accelerator/dawn (LiteRT-LM v0.14.0,
      # SHA-256-pinned in the script) → app jniLibs, so GPU generation works on
      # devices without OpenCL (GrapheneOS). Without this step the build still
      # succeeds — the engine's smoke test just falls back to CPU.
      - run: scripts/fetch-gpu-libs.sh
      # Tuki's Kokoro voice vectors (522KB, SHA-256-pinned) → APK assets.
      - run: scripts/fetch-voice-assets.sh
      # Hands-free listening model (2.3MB, SHA-256-pinned) → APK assets.
      - run: scripts/fetch-vad-asset.sh
      - run: ./gradlew test :app:assembleDebug :app:bundleDebug --stacktrace
      # Publish the installable debug APK so a green run yields a sideloadable
      # build for on-device testing (docs/running-on-device.md).
      # NOTE: the APK is the app only — the model is not bundled; install it in
      # app (Parent Zone → Packs) or via adb push.
      # The AAB is deliberately NOT published: bundleDebug above still
      # exercises the asset-pack module, but nothing consumes the .aab
      # (push.sh and TESTING.md install the APK).
      # DELIVERY: a rolling pre-release whose single asset is always
      # the newest green APK. Release assets do not count against the Actions
      # artifact storage quota — which blocked artifact uploads for weeks'
      # worth of a billing month once the quota was exceeded — and the release
      # URL is stable, so TESTING.md can link it directly.
      - name: Publish APK to the rolling debug-latest release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          NOTES="Newest green debug build.
          commit: ${{ github.sha }}
          built:  $(date -u +%Y-%m-%dT%H:%M:%SZ)
          The tag itself does not move; trust these notes and the asset, not the tag's commit."
          gh release view debug-latest >/dev/null 2>&1 || \
            gh release create debug-latest --prerelease \
              --title "Latest debug APK" --notes "$NOTES" --target "${{ github.sha }}"
          gh release upload debug-latest "$APK" --clobber
          gh release edit debug-latest --notes "$NOTES"
      # NOTE: no upload-artifact step. The release above IS the delivery
      # path — a public, stable URL that TESTING.md links directly, needing no
      # login and no expiry — so a duplicate ~245 MB run artifact only cost
      # upload time. (While the repo was private it also billed against the
      # Actions storage quota.) Re-add one if the release path ever fails.
